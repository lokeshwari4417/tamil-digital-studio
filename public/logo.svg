<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradient: Vibrant Orange/Red Circular Camera Element -->
    <linearGradient id="cameraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Ring Accent Gold -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Teal Gradient for Brand Accent -->
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>

  <!-- Outer Camera Circle Body -->
  <circle cx="256" cy="256" r="240" fill="url(#cameraGradient)" />

  <!-- Camera Lens Outer Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-opacity="0.9" />

  <!-- Gold Lens Accent Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#goldGradient)" stroke-width="12" />

  <!-- Inner Dark Camera Aperture Chamber -->
  <circle cx="256" cy="256" r="110" fill="#0F172A" />

  <!-- Shutter Blades -->
  <g fill="#FFFFFF" opacity="0.85">
    <path d="M256 146 L296 216 L256 226 Z" />
    <path d="M366 256 L296 296 L286 256 Z" opacity="0.9" />
    <path d="M256 366 L216 296 L256 286 Z" opacity="0.8" />
    <path d="M146 256 L216 216 L226 256 Z" opacity="0.95" />
  </g>

  <!-- Central Camera Lens Glass -->
  <circle cx="256" cy="256" r="54" fill="url(#tealGradient)" />
  <circle cx="256" cy="256" r="44" fill="#0D9488" />

  <!-- Lens Reflection Flash Light -->
  <circle cx="236" cy="236" r="14" fill="#FFFFFF" opacity="0.9" />
  <circle cx="270" cy="270" r="6" fill="#FFFFFF" opacity="0.6" />

  <!-- Camera Top Flash/Shutter Button Accent -->
  <path d="M216 26 L296 26 L286 56 L226 56 Z" fill="#FFFFFF" opacity="0.95" />
</svg>
